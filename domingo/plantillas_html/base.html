<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block titulo %}Sofía · domingo{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f4f2; color: #1d1d1b; line-height: 1.4; }
  main { max-width: 56rem; margin: 0 auto; padding: 1rem; }
  header { background: #1d1d1b; color: #fff; padding: .6rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  header form { margin: 0; }
  h1 { font-size: 1.3rem; margin: .2rem 0 .8rem; }
  h2 { font-size: 1.1rem; margin: 1rem 0 .6rem; }
  section { background: #fff; border: 1px solid #d8d8d4; border-radius: .5rem; padding: 1rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin: .6rem 0 .2rem; }
  input[type=text], input[type=password], input[type=file] { width: 100%; box-sizing: border-box; font-size: 1rem; padding: .6rem; border: 1px solid #888; border-radius: .3rem; background: #fff; }
  button { font-size: 1rem; padding: .7rem 1.1rem; border: 0; border-radius: .3rem; background: #0b5ed7; color: #fff; margin-top: .8rem; cursor: pointer; }
  button.peligro { background: #b3261e; }
  button.discreto { background: transparent; border: 1px solid #fff; padding: .35rem .7rem; margin: 0; font-size: .9rem; }
  .tabla { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #e4e4e0; vertical-align: top; }
  .bien { background: #e3f4e6; border: 1px solid #8fcf9a; padding: .6rem .8rem; border-radius: .3rem; margin-bottom: 1rem; }
  .mal, .error { background: #fde7e5; border: 1px solid #e59a95; padding: .6rem .8rem; border-radius: .3rem; margin-bottom: 1rem; }
  .aviso { background: #fff4d6; border: 1px solid #e3c36a; padding: .6rem .8rem; border-radius: .3rem; margin-bottom: 1rem; }
  .estado-monitoreo { color: #b3261e; font-weight: 600; }
  .estado-a_tiempo, .estado-entregado { color: #1b6b2a; font-weight: 600; }
  .chico { color: #555; font-size: .85rem; }
  ul { padding-left: 1.2rem; margin: .3rem 0; }
</style>
</head>
<body>
<header>
  <strong>Sofía · seguimiento del domingo</strong>
  {% if session.get('entro') %}
  <form method="post" action="/salir"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="discreto" type="submit">Salir</button></form>
  {% endif %}
</header>
<main>
{% for categoria, mensaje in mensajes or [] %}<div class="{{ categoria }}">{{ mensaje }}</div>{% endfor %}
{% block contenido %}{% endblock %}
</main>
</body>
</html>
